name: Release Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact checked commit requested by the dependency merge controller
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-binary-main
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify publication commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_SHA" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - run: cargo build --release --locked
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title latest --notes 'Automated latest build'
          fi
          python3 .github/scripts/release_manifest.py create target/release/another-it-tg-bridge delivery-manifest.json
          gh release upload latest target/release/another-it-tg-bridge --clobber
          gh release upload latest delivery-manifest.json --clobber
